name: Update casks

on:
  schedule:
    # 06:00 Asia/Shanghai (UTC+8)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update casks from upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update-casks.py

      - name: Verify updater scripts
        run: |
          python3 -m py_compile update-casks.py
          ruby -c Casks/tty7.rb
          ruby -c Casks/ayugram.rb
          ruby -c Casks/min.rb

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update casks to latest releases"
          file_pattern: Casks/*.rb
